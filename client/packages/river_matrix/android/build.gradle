// The Android Gradle Plugin builds the native code with the Android NDK.

group 'com.flutter_rust_bridge.river_matrix'
version '1.0'

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        // The Android Gradle Plugin knows how to build native code with the NDK.
        classpath 'com.android.tools.build:gradle:7.3.0'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
        maven {
            url 'https://raw.githubusercontent.com/rustls/rustls-platform-verifier/maven-archive/android-release-support/maven/'
            content { includeGroup 'org.rustls' }
        }
    }
}

apply plugin: 'com.android.library'

android {
    if (project.android.hasProperty("namespace")) {
        namespace 'com.flutter_rust_bridge.river_matrix'
    }

    // Bumping the plugin compileSdkVersion requires all clients of this plugin
    // to bump the version in their app.
    compileSdkVersion 36

    // Use the NDK version
    // declared in /android/app/build.gradle file of the Flutter project.
    // Replace it with a version number if this plugin requires a specfic NDK version.
    // (e.g. ndkVersion "23.1.7779620")
    ndkVersion android.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    defaultConfig {
        minSdkVersion 19
        consumerProguardFiles 'consumer-rules.pro'
    }
}

// The Kotlin verifier must match the Rust dependency, including after upgrades.
def verifierLock = file('../rust/Cargo.lock').getText('UTF-8')
def verifierVersion = (verifierLock =~ /(?m)^name = "rustls-platform-verifier-android"\r?\nversion = "([^"]+)"/)
if (!verifierVersion.find()) {
    throw new GradleException('Android certificate verifier is missing from Cargo.lock')
}
dependencies {
    implementation "org.rustls:rustls-platform-verifier:${verifierVersion.group(1)}"
}

apply from: "../cargokit/gradle/plugin.gradle"
cargokit {
    manifestDir = "../rust"
    libname = "river_matrix_core"
}
