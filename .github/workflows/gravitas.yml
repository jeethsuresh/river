name: River web and Android
on:
  push:
    branches: [main, codex/river-flutter-gravitas]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: river-${{ github.ref }}
  cancel-in-progress: false
jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Test Go relay and auth
        run: docker buildx build --target backend-test .
      - name: Analyze and test shared Flutter UI
        run: docker buildx build --target frontend-test .
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build immutable release
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ghcr.io/jeethsuresh/river:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Record digest
        run: echo 'ghcr.io/jeethsuresh/river@${{ steps.image.outputs.digest }}' >> "$GITHUB_STEP_SUMMARY"
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.GRAVITAS_DEPLOY_ENABLED == 'true'
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: gravitas
      url: https://chat.gravitas.cool
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install verified Kubernetes client
        run: |
          curl -fsSLo kubectl https://dl.k8s.io/release/v1.37.0/bin/linux/amd64/kubectl
          curl -fsSLo kubectl.sha256 https://dl.k8s.io/release/v1.37.0/bin/linux/amd64/kubectl.sha256
          echo "$(cat kubectl.sha256)  kubectl" | sha256sum --check
          chmod +x kubectl
          echo "$PWD" >> "$GITHUB_PATH"
      - name: Configure namespace-scoped deploy credential
        env:
          GRAVITAS_KUBECONFIG: ${{ secrets.GRAVITAS_KUBECONFIG }}
        run: |
          test -n "$GRAVITAS_KUBECONFIG"
          umask 077
          printf '%s' "$GRAVITAS_KUBECONFIG" > "$RUNNER_TEMP/river-kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/river-kubeconfig" >> "$GITHUB_ENV"
      - name: Deploy and verify public HTTPS
        env:
          RELEASE_IMAGE: ghcr.io/jeethsuresh/river@${{ needs.image.outputs.digest }}
        run: deploy/gravitas/deploy.sh "$RELEASE_IMAGE"
      - name: Remove deployment credential
        if: always()
        run: rm -f "$RUNNER_TEMP/river-kubeconfig"
