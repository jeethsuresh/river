name: River web and Android
on:
  push:
    branches: [main, codex/river-flutter-gravitas]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: river-${{ github.ref }}
  cancel-in-progress: false
jobs:
  matrix-interop:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Check out the Gravitas interoperability fixture
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: jeethsuresh/iam-server
          ref: bbc2272efa74d7b57edc740e742d6319e455f6be
          path: .matrix-server
          persist-credentials: false
      - name: Build disposable protocol peers and River client
        run: |
          docker build -f .matrix-server/Dockerfile.tests -t river-matrix-server:test .matrix-server
          docker build -f Dockerfile.matrix-tests -t river-matrix-client:test .
          docker build --target matrix-browser-interop-client -t river-matrix-browser:test .
      - name: Verify QR trust and encrypted key recovery
        run: bash integration/matrix/run.sh river-matrix-server:test river-matrix-client:test .matrix-server river-matrix-browser:test
  matrix-platforms:
    name: Matrix SDK (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, platform: linux}
          - {os: windows-2025, platform: windows}
          - {os: macos-15, platform: macos}
          - {os: macos-15, platform: ios}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install pinned Flutter
        run: |
          git init "$RUNNER_TEMP/river-flutter"
          git -C "$RUNNER_TEMP/river-flutter" remote add origin https://github.com/flutter/flutter.git
          git -C "$RUNNER_TEMP/river-flutter" fetch --depth 1 origin refs/tags/3.47.7:refs/tags/3.47.7
          git -C "$RUNNER_TEMP/river-flutter" checkout --detach abaf9c523780a608bd46686fd5e53740a07077f8
          test "$(git -C "$RUNNER_TEMP/river-flutter" rev-parse HEAD)" = abaf9c523780a608bd46686fd5e53740a07077f8
          echo "$RUNNER_TEMP/river-flutter/bin" >> "$GITHUB_PATH"
      - name: Install pinned Rust
        run: bash scripts/matrix-toolchain.sh
      - name: Linux platform dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - name: Test Matrix core and binary QR handling
        run: cargo test --locked --manifest-path client/packages/river_matrix/rust/Cargo.toml --lib
      - name: Verify browser bridge
        if: runner.os == 'Linux'
        run: |
          rustup target add wasm32-unknown-unknown --toolchain 1.96.0
          cargo check --locked --manifest-path client/packages/river_matrix/rust/Cargo.toml --target wasm32-unknown-unknown
      - name: Link Flutter platform application
        run: python3 scripts/matrix-platform-smoke.py '${{ matrix.platform }}'
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install pinned Flutter SDK
        run: |
          git init "$RUNNER_TEMP/river-flutter"
          git -C "$RUNNER_TEMP/river-flutter" remote add origin https://github.com/flutter/flutter.git
          git -C "$RUNNER_TEMP/river-flutter" fetch --depth 1 origin refs/tags/3.47.7:refs/tags/3.47.7
          git -C "$RUNNER_TEMP/river-flutter" checkout --detach abaf9c523780a608bd46686fd5e53740a07077f8
          test "$(git -C "$RUNNER_TEMP/river-flutter" rev-parse HEAD)" = abaf9c523780a608bd46686fd5e53740a07077f8
      - name: Install pinned Rust
        run: bash scripts/matrix-toolchain.sh
      - name: Build shared Android client
        working-directory: client
        env:
          FLUTTER_SUPPRESS_ANALYTICS: 'true'
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$RUNNER_TEMP/river-flutter/bin:$PATH"
          flutter config --no-analytics
          flutter pub get --enforce-lockfile
          flutter build apk --debug --no-pub
      - name: Verify warm and cold Android authentication returns
        timeout-minutes: 12
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          export ANDROID_USER_HOME="$RUNNER_TEMP/river-android-user"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          cp client/build/app/outputs/flutter-apk/app-debug.apk "$RUNNER_TEMP/river-auth-return.apk"
          ./client/android/gradlew --stop
          # The installed APK is the tested artifact; compiler intermediates are
          # no longer needed and otherwise compete with the emulator for disk.
          rm -rf client/build
          sudo chown "$(id -u):$(id -g)" /dev/kvm
          sdkmanager 'platform-tools' 'emulator' 'system-images;android-35;google_apis;x86_64'
          printf 'no\n' | avdmanager create avd --force --name river-auth-return --path "$ANDROID_AVD_HOME/river-auth-return.avd" --package 'system-images;android-35;google_apis;x86_64'
          test -s "$ANDROID_AVD_HOME/river-auth-return.avd/config.ini"
          # Keep emulator discovery independent of the command-line tools'
          # default preferences directory, which differs between SDK releases.
          printf 'avd.ini.encoding=UTF-8\npath=%s\ntarget=android-35\n' "$ANDROID_AVD_HOME/river-auth-return.avd" > "$ANDROID_AVD_HOME/river-auth-return.ini"
          python3 scripts/test-android-auth-return.py --apk "$RUNNER_TEMP/river-auth-return.apk" --avd river-auth-return
  image:
    needs: [android, matrix-platforms, matrix-interop]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Test Go relay and auth
        run: docker buildx build --target backend-test .
      - name: Analyze and test shared Flutter UI
        run: docker buildx build --target frontend-test .
      - name: Verify browser Matrix WebAssembly runtime
        run: docker buildx build --target matrix-browser-test .
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build immutable release
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ghcr.io/jeethsuresh/river:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Record digest
        run: echo 'ghcr.io/jeethsuresh/river@${{ steps.image.outputs.digest }}' >> "$GITHUB_STEP_SUMMARY"
  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: gravitas
      url: "https://chat.gravitas.cool"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Fetch pinned private deployment tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: jeethsuresh/gravitas-deploy
          ref: 1672e6fef247f5ba36ed07ac178dc41482cddaba
          path: .gravitas-runtime
          ssh-key: ${{ secrets.GRAVITAS_TOOLING_SSH_KEY }}
          persist-credentials: false
      - name: Deploy and verify immutable release
        uses: ./.gravitas-runtime
        with:
          config: .gravitas/deploy.json
          image: ghcr.io/jeethsuresh/river@${{ needs.image.outputs.digest }}
          kubeconfig: ${{ secrets.GRAVITAS_KUBECONFIG }}
